[package]
name = "fridrichtrainer"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1"
js-sys = "0.3"
leptos = { version = "0.8.22", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "BlobPropertyBag",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Performance",
    "Storage",
    "TouchEvent",
    "Url",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
